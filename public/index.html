<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuốn Lưu Bút Sinh Nhật Tuổi 32 - Jimmy Jitaraphol 💜✨</title>
  <meta name="description" content="Cuốn lưu bút đong đầy tình yêu thương và những lời chúc tốt đẹp nhất dành tặng sinh nhật tuổi 32 cho P'Jim (Dr. Jimmy Jitaraphol Potiwihok).">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Layer sử dụng ảnh nền.png -->
  <div class="bg-layer" style="background-image: url('/assets/nền.png');"></div>

  <!-- Audio Player dùng file music.mp3 -->
  <audio id="bgAudio" src="/assets/music.mp3" loop></audio>

  <!-- Nút Loa Bật/Tắt Âm Thanh ở Góc Trên Cùng Bên Phải -->
  <button id="volumeBtn" class="volume-btn" title="Bật/Tắt Nhạc Nền">
    <i class="fa-solid fa-volume-xmark" id="volumeIcon"></i>
  </button>

  <!-- Header với Logo duy nhất -->
  <header class="app-header">
    <div class="header-container">
      <div class="logo-wrapper">
        <img src="/assets/logo.png" alt="Logo Sinh Nhật P'Jim" class="site-logo">
      </div>

      <!-- Icon Toggle Lật Sách / Dạng Lưới / Chia Bài Tây -->
      <div class="view-toggles-compact">
        <button id="btnFlipbookView" class="icon-toggle-btn active" title="Xem Lật Sách (Flipbook)">
          <i class="fa-solid fa-book-open"></i>
        </button>
        <button id="btnGridView" class="icon-toggle-btn" title="Xem Dạng Lưới">
          <i class="fa-solid fa-border-all"></i>
        </button>
        <button id="btnDeckView" class="icon-toggle-btn" title="Xem Kiểu Chia Bài Tây (Cards Deck)">
          <i class="fa-solid fa-layer-group"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="app-main">
    <!-- VIEW 1: FLIPBOOK / PAGE BY PAGE VIEW -->
    <section id="flipbookSection" class="view-section active">
      <div class="flipbook-wrapper">
        <!-- Controls Left -->
        <button id="prevPageBtn" class="nav-arrow left-arrow" title="Trang trước">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <!-- Book Stage -->
        <div class="book-stage">
          <div id="activeCardContainer" class="card-display-area">
            <!-- Dynamic Active Card rendered by JS -->
          </div>
        </div>

        <!-- Controls Right -->
        <button id="nextPageBtn" class="nav-arrow right-arrow" title="Trang sau">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Book Pagination Indicator -->
      <div class="pagination-bar">
        <span id="pageIndicatorText">Trang 1 / 27</span>
        <div class="page-dots" id="pageDots"></div>
      </div>
    </section>

    <!-- VIEW 2: GRID / SCRAPBOOK GALLERY VIEW -->
    <section id="gridSection" class="view-section">
      <div id="cardsGridContainer" class="cards-grid">
        <!-- Dynamic Cards grid rendered by JS -->
      </div>
    </section>

    <!-- VIEW 3: CARDS FAN / DECK SPREAD VIEW (CHIA BÀI TÂY) -->
    <section id="deckSection" class="view-section">
      <div class="deck-header-bar">
        <button id="shuffleDeckBtn" class="deck-action-btn">
          <i class="fa-solid fa-shuffle"></i> Tráo & Rút Bài Ngẫu Nhiên 🃏
        </button>
        <div class="deck-mode-toggle">
          <button id="btnFanMode" class="deck-submode-btn active" title="Xòe Bài Dạng Quạt">
            <i class="fa-solid fa-fan"></i> Xòe Quạt
          </button>
          <button id="btnStackMode" class="deck-submode-btn" title="Xếp Chồng Bộ Bài">
            <i class="fa-solid fa-clone"></i> Xếp Chồng
          </button>
          <button id="btnCascadeMode" class="deck-submode-btn" title="Trải Bài Dòng Chảy">
            <i class="fa-solid fa-bars-staggered"></i> Dòng Chảy
          </button>
        </div>
      </div>

      <div class="deck-stage">
        <div id="cardsDeckContainer" class="cards-deck fan-mode">
          <!-- Dynamic cards rendered by JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Pop-up khi bấm vào Lá Bài Tây (Đặt ở root body để không bị gò gò bởi z-index/overflow parent) -->
  <div id="deckModalOverlay" class="deck-modal-overlay">
    <div class="deck-modal-box">
      <button id="closeDeckModalBtn" class="close-deck-modal-btn" title="Đóng lá bài">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="deckModalCardBody" class="deck-modal-card-body"></div>
      <div class="deck-modal-footer">
        <button id="goToFlipbookFromDeckBtn" class="deck-modal-action-btn">
          <i class="fa-solid fa-book-open"></i> Xem Trong Cuốn Lưu Bút (Flipbook)
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
