<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cuốn Lưu Bút Sinh Nhật Tuổi 32 - Jimmy Jitaraphol 💜✨</title>
  <meta name="description" content="Cuốn lưu bút đong đầy tình yêu thương và những lời chúc tốt đẹp nhất dành tặng sinh nhật tuổi 32 cho P'Jim (Dr. Jimmy Jitaraphol Potiwihok).">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css?v=10">
</head>
<body class="flipbook-mode">
  <!-- Background Layer sử dụng ảnh nền.png -->
  <div class="bg-layer" style="background-image: url('/assets/nền.png');"></div>

  <!-- Audio Player dùng file music.mp3 -->
  <audio id="bgAudio" src="/assets/music.mp3" loop></audio>

  <!-- Nút Loa Bật/Tắt Âm Thanh ở Góc Trên Cùng Bên Phải -->
  <button id="volumeBtn" class="volume-btn" title="Bật/Tắt Nhạc Nền">
    <i class="fa-solid fa-volume-xmark" id="volumeIcon"></i>
  </button>

  <!-- Header với Logo duy nhất -->
  <header class="app-header">
    <div class="header-container">
      <div class="logo-wrapper">
        <img src="/assets/logo.png" alt="Logo Sinh Nhật P'Jim" class="site-logo">
      </div>

      <!-- Icon Toggle Lật Sách / Dạng Lưới -->
      <div class="view-toggles-compact">
        <button id="btnFlipbookView" class="icon-toggle-btn active" title="Xem Lật Sách (Flipbook)">
          <i class="fa-solid fa-book-open"></i>
        </button>
        <button id="btnGridView" class="icon-toggle-btn" title="Xem Dạng Lưới">
          <i class="fa-solid fa-border-all"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="app-main">
    <!-- VIEW 1: FLIPBOOK / PAGE BY PAGE VIEW -->
    <section id="flipbookSection" class="view-section active">
      <div class="flipbook-wrapper">
        <!-- Controls Left -->
        <button id="prevPageBtn" class="nav-arrow left-arrow" title="Trang trước">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <!-- Book Stage -->
        <div class="book-stage">
          <div id="activeCardContainer" class="card-display-area">
            <!-- Dynamic Active Card rendered by JS -->
          </div>
        </div>

        <!-- Controls Right -->
        <button id="nextPageBtn" class="nav-arrow right-arrow" title="Trang sau">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Book Pagination Indicator -->
      <div class="pagination-bar">
        <span id="pageIndicatorText">Trang 1 / 27</span>
        <div class="page-dots" id="pageDots"></div>
      </div>
    </section>

    <!-- VIEW 2: GRID / SCRAPBOOK GALLERY VIEW -->
    <section id="gridSection" class="view-section">
      <div id="cardsGridContainer" class="cards-grid">
        <!-- Dynamic Cards grid rendered by JS -->
      </div>
    </section>
  </main>

  <script src="script.js?v=10"></script>
</body>
</html>
